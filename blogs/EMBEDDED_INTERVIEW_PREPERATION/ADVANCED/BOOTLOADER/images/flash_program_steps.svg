<line x1="313.3" y1="114.2" x2="350.3" y2="114.2" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="690.7" y="78.0" width="289.3" height="72.3" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="835.3" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Erase sector(s)</text>
<text x="835.3" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">every bit becomes 1 (0xFF)</text>
<circle cx="692.6666666666666" cy="80" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>

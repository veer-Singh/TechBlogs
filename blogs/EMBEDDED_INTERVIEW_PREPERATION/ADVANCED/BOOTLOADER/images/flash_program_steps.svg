<line x1="648.7" y1="114.2" x2="685.7" y2="114.2" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="835.3,152.3 835.3,178.3 164.7,178.3 164.7,202.3" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="206.3" width="289.3" height="72.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="164.7" y="235.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Program data</text>
<text x="164.7" y="261.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">word by word; bits can only go 1 → 0</text>
<circle cx="22.0" cy="208.35" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>

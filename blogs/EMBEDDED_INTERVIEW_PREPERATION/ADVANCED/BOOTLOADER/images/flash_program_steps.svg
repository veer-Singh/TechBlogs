<rect x="355.3" y="206.3" width="289.3" height="72.3" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="500.0" y="235.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Verify</text>
<text x="500.0" y="261.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">read back and compare, or CRC</text>

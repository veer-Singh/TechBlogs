<rect x="355.3" y="78.0" width="289.3" height="72.3" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="500.0" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Clear error flags</text>
<text x="500.0" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">old flags make the next operation fail</text>
<circle cx="357.3333333333333" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>

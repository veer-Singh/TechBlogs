<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 473" width="1000" height="473"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="473.04999999999995" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">From power-on to main(): the 8 steps</text>
<rect x="20.0" y="78.0" width="205.5" height="124.8" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="122.8" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Reset source</text>
<text x="122.8" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">power-on, reset pin,</text>
<text x="122.8" y="150.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">watchdog or software</text>
<text x="122.8" y="167.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">reset; the CPU is held</text>
<text x="122.8" y="185.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">until power is stable</text>
<circle cx="22.0" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
<rect x="271.5" y="78.0" width="205.5" height="124.8" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="374.2" y="115.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Boot pins sampled</text>
<text x="374.2" y="141.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">BOOT0 decides what appears</text>
<text x="374.2" y="159.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">at address 0x0000_0000</text>
<text x="374.2" y="176.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">(flash, ROM or SRAM)</text>
<circle cx="273.5" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="273.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
<line x1="229.5" y1="140.4" x2="266.5" y2="140.4" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="523.0" y="78.0" width="205.5" height="124.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="625.8" y="115.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Load MSP</text>
<text x="625.8" y="141.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the CPU reads word 0</text>
<text x="625.8" y="159.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">(0x0000_0000) into the</text>
<text x="625.8" y="176.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">Main Stack Pointer</text>
<circle cx="525.0" cy="80" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="525.0" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
<line x1="481.0" y1="140.4" x2="518.0" y2="140.4" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="774.5" y="78.0" width="205.5" height="124.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="877.2" y="115.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Load PC</text>
<text x="877.2" y="141.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the CPU reads word 1</text>
<text x="877.2" y="159.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">(0x0000_0004) into the PC:</text>
<text x="877.2" y="176.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the Reset_Handler address</text>
<circle cx="776.5" cy="80" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="776.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
<line x1="732.5" y1="140.4" x2="769.5" y2="140.4" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="877.2,204.8 877.2,230.8 122.8,230.8 122.8,254.9" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="258.9" width="205.5" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="122.8" y="287.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Reset_Handler</text>
<text x="122.8" y="313.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">sets SP again (ldr sp,</text>
<text x="122.8" y="331.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">=_estack), calls</text>
<text x="122.8" y="348.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">SystemInit(): clock, FPU</text>
<circle cx="22.0" cy="260.85" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="265.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
<rect x="271.5" y="258.9" width="205.5" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="374.2" y="296.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Copy .data</text>
<text x="374.2" y="322.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">initial values of global</text>
<text x="374.2" y="340.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">variables: flash → RAM</text>
<circle cx="273.5" cy="260.85" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="273.5" y="265.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">6</text>
<line x1="229.5" y1="312.5" x2="266.5" y2="312.5" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="523.0" y="258.9" width="205.5" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="625.8" y="296.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Zero .bss</text>
<text x="625.8" y="322.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">uninitialised global</text>
<text x="625.8" y="340.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">variables = 0</text>
<circle cx="525.0" cy="260.85" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="525.0" y="265.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">7</text>
<line x1="481.0" y1="312.5" x2="518.0" y2="312.5" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="774.5" y="258.9" width="205.5" height="107.3" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="877.2" y="287.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">main()</text>
<text x="877.2" y="313.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">after __libc_init_array()</text>
<text x="877.2" y="331.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">(C++ constructors); main()</text>
<text x="877.2" y="348.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">never returns</text>
<circle cx="776.5" cy="260.85" r="14" fill="#2e8b57" stroke="#ffffff" stroke-width="2.5"/>
<text x="776.5" y="265.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">8</text>
<line x1="732.5" y1="312.5" x2="769.5" y2="312.5" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="20.0" y="400.2" width="960.0" height="48.9" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="429.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Steps 1-4 are done by the HARDWARE; steps 5-8 by the startup code (startup_stm32xxxx.s)</text>
</svg>

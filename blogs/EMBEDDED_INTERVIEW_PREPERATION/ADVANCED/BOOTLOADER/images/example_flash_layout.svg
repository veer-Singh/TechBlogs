<rect x="20.0" y="420.0" width="960.0" height="56.0" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="440.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">flash_layout.h is copied into BOTH projects</text>
<text x="500.0" y="465.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">so the bootloader and the application always agree on every address</text>

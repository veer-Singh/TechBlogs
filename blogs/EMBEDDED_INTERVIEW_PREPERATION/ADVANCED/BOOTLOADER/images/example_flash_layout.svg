<text x="485.0" y="269.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">App header</text>
<text x="485.0" y="296.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">OTA flag, magic, size, CRC, version (.header section)</text>
<text x="740.0" y="281.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97d00">1 KB</text>

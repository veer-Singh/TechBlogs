<text x="485.0" y="184.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">vector table first; linked at 0x0800_4400</text>
<text x="740.0" y="169.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e8b57">47 KB</text>
<text x="235.0" y="236.0" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#6b7280">0x0800_4400</text>

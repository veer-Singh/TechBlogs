<text x="374.2" y="123.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Add the device tree</text>
<text x="374.2" y="142.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">node</text>
<text x="374.2" y="168.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">or enable an existing one</text>
<circle cx="273.5" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="273.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
<line x1="229.5" y1="140.4" x2="266.5" y2="140.4" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="523.0" y="78.0" width="205.5" height="124.8" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="625.8" y="133.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Enable the driver</text>
<text x="625.8" y="159.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">in the kernel defconfig</text>
<circle cx="525.0" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="525.0" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
<line x1="481.0" y1="140.4" x2="518.0" y2="140.4" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="774.5" y="78.0" width="205.5" height="124.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="877.2" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Boot and check dmesg</text>
<text x="877.2" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">did the driver find it? if</text>
<text x="877.2" y="150.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">not: check pins, power,</text>
<text x="877.2" y="167.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">clocks, compatible,</text>
<text x="877.2" y="185.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">firmware</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 373" width="1000" height="373"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="373.2" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Bringing up one peripheral: repeat this loop for each device</text>
<rect x="20.0" y="78.0" width="205.5" height="124.8" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="122.8" y="124.3" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Read the schematic</text>

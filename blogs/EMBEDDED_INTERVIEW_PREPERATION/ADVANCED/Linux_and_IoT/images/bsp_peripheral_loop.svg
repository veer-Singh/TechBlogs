<rect x="516.7" y="217.8" width="218.1" height="22" rx="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="625.8" y="232.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">not working? fix it, try again</text>
<rect x="20.0" y="276.9" width="960.0" height="72.3" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="500.0" y="305.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">It works: test it from user space</text>
<text x="500.0" y="331.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">i2cdetect, ethtool, reading /sys ... then move on to the next device</text>

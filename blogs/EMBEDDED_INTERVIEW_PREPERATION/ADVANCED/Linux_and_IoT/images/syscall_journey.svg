<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">One system call, step by step: an app writes 'hi' to a serial port</text>
<text x="30" y="70" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2e8b57">USER SPACE (EL0)</text>
<text x="30" y="232" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e08a00">KERNEL SPACE (EL1)</text>
<line x1="20" y1="212" x2="980" y2="212" stroke="#e08a00" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="30" y="85" width="280" height="90" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="170" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">1  Your app</text>
<text x="170" y="146" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#374151">write(fd, "hi\n", 3);</text>
<rect x="360" y="85" width="280" height="90" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="500" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">2  C library</text>
<text x="500" y="146" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#374151">x8 = 64 (write), x0-x2 = arguments</text>
<rect x="690" y="85" width="280" height="90" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="830" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">3  svc #0</text>
<text x="830" y="146" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#374151">a trap: CPU switches to EL1</text>
<line x1="310" y1="130" x2="356" y2="130" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="640" y1="130" x2="686" y2="130" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="830" y1="175" x2="830" y2="243" stroke="#e08a00" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="755" y="245" width="215" height="96" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="862" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">4  Exception entry</text>
<text x="862" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">save registers,</text>
<text x="862" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">look up table[64]</text>
<rect x="515" y="245" width="215" height="96" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="622" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">5  sys_write()</text>
<text x="622" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">find the file</text>
<text x="622" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">behind fd</text>
<rect x="275" y="245" width="215" height="96" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="382" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">6  VFS → tty layer</text>
<text x="382" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">"it's a serial</text>
<text x="382" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">port"</text>
<rect x="35" y="245" width="215" height="96" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="142" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">7  UART driver</text>
<text x="142" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">copy bytes into</text>
<text x="142" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">the TX FIFO</text>
<line x1="755" y1="293" x2="734" y2="293" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="515" y1="293" x2="494" y2="293" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="275" y1="293" x2="254" y2="293" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="142" y1="341" x2="142" y2="383" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="385" width="215" height="70" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="142" y="412" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">UART hardware</text>
<text x="142" y="435" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">'h' 'i' '\n' leave on TX</text>
<rect x="290" y="370" width="680" height="90" rx="10" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="630" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">8  The way back</text>
<text x="630" y="422" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">The kernel puts the result (3 = bytes written) in x0 and executes eret.</text>
<text x="630" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">The CPU drops back to EL0 and write() returns 3 to your app.</text>
<rect x="30" y="478" width="940" height="62" rx="10" fill="#0f1b2d"/>
<text x="500" y="503" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f0a23b">See it for yourself:</text>
<text x="500" y="526" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3">$ strace -e trace=write ./app      →      write(3, "hi\n", 3) = 3</text>
</svg>

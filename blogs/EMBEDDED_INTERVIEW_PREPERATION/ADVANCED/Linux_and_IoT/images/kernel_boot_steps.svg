<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 521" width="1000" height="521"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>

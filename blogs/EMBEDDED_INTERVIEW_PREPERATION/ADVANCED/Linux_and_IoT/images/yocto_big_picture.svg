<rect x="360" y="150" width="280" height="240" rx="18" fill="#0f1b2d"/>
<text x="500" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f6f7f4">BitBake</text>
<text x="500" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c9d3e0">the build engine</text>
<text x="385" y="250" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">1  read every recipe</text>

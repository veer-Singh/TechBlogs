<text x="840" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2e8b57">OUTPUTS</text>
<rect x="20" y="78" width="280" height="170" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="160" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Layers of metadata</text>
<text x="40" y="132" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• poky / OE-core: the basics</text>
<text x="40" y="160" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• meta-openembedded: extra software</text>
<text x="40" y="188" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• BSP layer: your board</text>
<text x="40" y="216" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• meta-mycompany: your apps</text>
<rect x="20" y="262" width="280" height="90" rx="12" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>

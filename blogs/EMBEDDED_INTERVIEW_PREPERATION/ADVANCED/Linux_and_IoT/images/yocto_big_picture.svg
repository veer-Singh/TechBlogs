<text x="160" y="414" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">git repos, tarballs, patches</text>
<text x="160" y="434" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">fetched automatically</text>
<line x1="300" y1="163" x2="356" y2="265" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

<text x="385" y="314" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">3  run thousands of tasks in parallel</text>
<text x="385" y="346" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">4  reuse cached results (sstate)</text>
<text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e08a00">first build: hours · rebuilds: minutes</text>

<text x="160" y="312" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1f2937">local.conf · bblayers.conf</text>
<text x="160" y="334" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e08a00">MACHINE · DISTRO · IMAGE</text>

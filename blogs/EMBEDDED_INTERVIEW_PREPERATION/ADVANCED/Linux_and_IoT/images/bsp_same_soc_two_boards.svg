<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 353" width="1000" height="353"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="353.15" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Same chip, different boards, so each board needs its own BSP</text>
<rect x="200.0" y="66.0" width="600.0" height="76.3" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="97.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">The same SoC</text>
<text x="500.0" y="126.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d3e0">e.g. NXP i.MX 8M Mini</text>
<line x1="500.0" y1="142.3" x2="500.0" y2="172.3" stroke="#374151" stroke-width="2.2"/>
<rect x="20.0" y="202.3" width="471.0" height="124.8" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="34.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Board A → needs BSP A</text>
<text x="34.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• 2 GB DDR4 memory</text>
<text x="34.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• eMMC storage</text>
<text x="34.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• Ethernet PHY X</text>
<text x="34.0" y="309.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• debug UART on UART2</text>
<polyline points="500.0,172.3 255.5,172.3 255.5,198.3" fill="none" stroke="#2f6fbe" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="509.0" y="202.3" width="471.0" height="124.8" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="523.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Board B → needs BSP B</text>
<text x="523.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• 1 GB LPDDR4 memory</text>
<text x="523.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• SD card</text>
<text x="523.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• Wi-Fi module + camera</text>
<text x="523.0" y="309.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• debug UART on UART1</text>
<polyline points="500.0,172.3 744.5,172.3 744.5,198.3" fill="none" stroke="#7b3fbf" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="660" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Modbus RTU over RS-485: one master, many slaves, one twisted pair</text>
<line x1="80" y1="110" x2="920" y2="110" stroke="#1d4ed8" stroke-width="3"/>
<text x="942" y="115" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">A (+)</text>
<line x1="80" y1="135" x2="920" y2="135" stroke="#c0392b" stroke-width="3"/>
<text x="942" y="140" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">B (−)</text>
<rect x="66" y="104" width="28" height="38" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="80" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#374151">120 Ω</text>
<rect x="906" y="104" width="28" height="38" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="920" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#374151">120 Ω</text>
<text x="500" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">twisted pair, terminated at BOTH ends</text>
<line x1="160" y1="110" x2="160" y2="170" stroke="#1d4ed8" stroke-width="2"/>
<line x1="180" y1="135" x2="180" y2="170" stroke="#c0392b" stroke-width="2"/>
<circle cx="160" cy="110" r="4" fill="#1d4ed8"/><circle cx="180" cy="135" r="4" fill="#c0392b"/>
<rect x="110" y="170" width="120" height="26" rx="5" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.5"/>
<text x="170" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#2f6fbe">RS-485 transceiver</text>
<rect x="95" y="200" width="150" height="52" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="170" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Master</text>
<text x="170" y="241" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">PLC / Linux gateway</text>
<line x1="390" y1="110" x2="390" y2="170" stroke="#1d4ed8" stroke-width="2"/>
<line x1="410" y1="135" x2="410" y2="170" stroke="#c0392b" stroke-width="2"/>
<circle cx="390" cy="110" r="4" fill="#1d4ed8"/><circle cx="410" cy="135" r="4" fill="#c0392b"/>
<rect x="340" y="170" width="120" height="26" rx="5" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.5"/>
<text x="400" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#2f6fbe">RS-485 transceiver</text>
<rect x="325" y="200" width="150" height="52" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="400" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Slave 1</text>
<text x="400" y="241" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">energy meter</text>
<line x1="610" y1="110" x2="610" y2="170" stroke="#1d4ed8" stroke-width="2"/>
<line x1="630" y1="135" x2="630" y2="170" stroke="#c0392b" stroke-width="2"/>
<circle cx="610" cy="110" r="4" fill="#1d4ed8"/><circle cx="630" cy="135" r="4" fill="#c0392b"/>
<rect x="560" y="170" width="120" height="26" rx="5" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.5"/>
<text x="620" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#2f6fbe">RS-485 transceiver</text>
<rect x="545" y="200" width="150" height="52" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="620" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Slave 2</text>
<text x="620" y="241" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">temperature controller</text>
<line x1="830" y1="110" x2="830" y2="170" stroke="#1d4ed8" stroke-width="2"/>
<line x1="850" y1="135" x2="850" y2="170" stroke="#c0392b" stroke-width="2"/>
<circle cx="830" cy="110" r="4" fill="#1d4ed8"/><circle cx="850" cy="135" r="4" fill="#c0392b"/>
<rect x="780" y="170" width="120" height="26" rx="5" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.5"/>
<text x="840" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#2f6fbe">RS-485 transceiver</text>
<rect x="765" y="200" width="150" height="52" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="840" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Slave 3</text>
<text x="840" y="241" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">motor drive (VFD)</text>
<text x="500" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Differential signal (A − B) resists noise · half-duplex: one talker at a time (DE/RE pin)</text>
<text x="500" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Up to 32 unit loads per segment · up to 1200 m at low speed · addresses 1-247 (0 = broadcast)</text>
<rect x="20" y="315" width="960" height="330" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Read 2 holding registers from slave 1, starting at register 0</text>
<text x="40" y="372" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a00">Request  (master → slave 1)</text>
<rect x="40" y="382" width="110" height="56" rx="6" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.8"/>
<text x="95.0" y="407.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">01</text>
<text x="95.0" y="425.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">slave address</text>
<rect x="154" y="382" width="250" height="56" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="1.8"/>
<text x="279.0" y="407.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">03</text>
<text x="279.0" y="425.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">function: read holding registers</text>
<rect x="408" y="382" width="150" height="56" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="483.0" y="407.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">00 00</text>
<text x="483.0" y="425.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">start register = 0</text>
<rect x="562" y="382" width="150" height="56" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="637.0" y="407.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">00 02</text>
<text x="637.0" y="425.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">quantity = 2</text>
<rect x="716" y="382" width="200" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="816.0" y="407.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">C4 0B</text>
<text x="816.0" y="425.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">CRC-16 (low byte first)</text>
<text x="40" y="470" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e8b57">Response  (slave 1 → master)</text>
<rect x="40" y="480" width="110" height="56" rx="6" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.8"/>
<text x="95.0" y="505.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">01</text>
<text x="95.0" y="523.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">slave address</text>
<rect x="154" y="480" width="130" height="56" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="1.8"/>
<text x="219.0" y="505.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">03</text>
<text x="219.0" y="523.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">same function</text>
<rect x="288" y="480" width="130" height="56" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="353.0" y="505.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">04</text>
<text x="353.0" y="523.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">byte count = 4</text>
<rect x="422" y="480" width="150" height="56" rx="6" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="497.0" y="505.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">00 0A</text>
<text x="497.0" y="523.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">register 0 = 10</text>
<rect x="576" y="480" width="150" height="56" rx="6" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="651.0" y="505.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">00 14</text>
<text x="651.0" y="523.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">register 1 = 20</text>
<rect x="730" y="480" width="150" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="805.0" y="505.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937">DA 3E</text>
<text x="805.0" y="523.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">CRC-16</text>
<text x="500" y="568" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Frames are separated by at least 3.5 character times of silence on the bus</text>
<text x="500" y="590" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Error reply: function code + 0x80 and an exception code, e.g. 01 83 02 = illegal data address</text>
<text x="500" y="620" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7280">Modbus TCP: same function codes over Ethernet, port 502, 7-byte MBAP header, no CRC</text>
</svg>

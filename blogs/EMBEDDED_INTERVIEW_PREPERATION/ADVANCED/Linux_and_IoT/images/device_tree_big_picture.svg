<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 462" width="1000" height="462"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="461.54999999999995" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">The device tree: from a text file to working devices</text>
<rect x="20.0" y="78.0" width="289.3" height="89.8" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="164.7" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Source files (.dtsi + .dts)</text>
<text x="164.7" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">text you write: the SoC part (.dtsi)</text>
<text x="164.7" y="150.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">and the board part (.dts)</text>
<circle cx="22.0" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
<rect x="355.3" y="78.0" width="289.3" height="89.8" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="500.0" y="115.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">C preprocessor (cpp)</text>
<text x="500.0" y="141.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">expands #include and #define macros</text>
<circle cx="357.3333333333333" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="357.3" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
<line x1="313.3" y1="122.9" x2="350.3" y2="122.9" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="690.7" y="78.0" width="289.3" height="89.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="835.3" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Device Tree Compiler (dtc)</text>
<text x="835.3" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">checks the syntax and turns text into</text>
<text x="835.3" y="150.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">binary</text>
<circle cx="692.6666666666666" cy="80" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="692.7" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
<line x1="648.7" y1="122.9" x2="685.7" y2="122.9" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="835.3,169.8 835.3,195.8 164.7,195.8 164.7,219.8" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="223.8" width="289.3" height="107.3" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="164.7" y="261.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Blob (.dtb)</text>
<text x="164.7" y="287.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">compact binary, stored in /boot next to</text>
<text x="164.7" y="305.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the kernel</text>
<circle cx="22.0" cy="225.85" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="230.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
<rect x="355.3" y="223.8" width="289.3" height="107.3" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="500.0" y="261.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Bootloader (U-Boot)</text>
<text x="500.0" y="287.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">loads the .dtb into RAM, may patch it,</text>
<text x="500.0" y="305.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">passes its address</text>
<circle cx="357.3333333333333" cy="225.85" r="14" fill="#7b3fbf" stroke="#ffffff" stroke-width="2.5"/>
<text x="357.3" y="230.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
<line x1="313.3" y1="277.5" x2="350.3" y2="277.5" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="690.7" y="223.8" width="289.3" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="835.3" y="252.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Linux kernel</text>
<text x="835.3" y="278.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">reads the .dtb, matches 'compatible'</text>
<text x="835.3" y="296.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">strings, probes drivers → devices in</text>
<text x="835.3" y="313.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">/dev and /sys</text>
<circle cx="692.6666666666666" cy="225.85" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="692.7" y="230.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">6</text>
<line x1="648.7" y1="277.5" x2="685.7" y2="277.5" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="20.0" y="365.2" width="960.0" height="72.3" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="500.0" y="394.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Optional: overlays (.dtbo)</text>
<text x="500.0" y="420.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">small patches applied on top of the .dtb by the bootloader, e.g. for an add-on board</text>
</svg>

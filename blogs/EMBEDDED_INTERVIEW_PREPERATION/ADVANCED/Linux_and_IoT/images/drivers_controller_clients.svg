<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 318" width="1000" height="318"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="318.15" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Bus (controller) driver vs client drivers, on an I2C bus</text>
<rect x="200.0" y="66.0" width="600.0" height="76.3" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="97.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">I2C controller driver, inside the SoC</text>
<text x="500.0" y="126.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d3e0">the bus / adapter driver: drives the chip's I2C hardware block</text>
<line x1="500.0" y1="142.3" x2="500.0" y2="172.3" stroke="#374151" stroke-width="2.2"/>
<rect x="20.0" y="202.3" width="308.0" height="89.8" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="34.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Client driver: temperature sensor</text>
<text x="34.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• address 0x48</text>
<text x="34.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• knows the sensor's registers</text>
<polyline points="500.0,172.3 174.0,172.3 174.0,198.3" fill="none" stroke="#2e8b57" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="346.0" y="202.3" width="308.0" height="89.8" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="360.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Client driver: EEPROM</text>
<text x="360.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• address 0x50</text>
<text x="360.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• reads and writes memory</text>
<polyline points="500.0,172.3 500.0,172.3 500.0,198.3" fill="none" stroke="#2e8b57" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="672.0" y="202.3" width="308.0" height="89.8" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="686.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Client driver: PMIC</text>
<text x="686.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• address 0x4b</text>
<text x="686.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• controls power rails</text>
<polyline points="500.0,172.3 826.0,172.3 826.0,198.3" fill="none" stroke="#2e8b57" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="650" rx="16" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Board Support Package: the layer between your hardware and your application</text>

  <!-- ===== Application ===== -->
  <rect x="260" y="68" width="480" height="58" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="500" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Your application and services</text>
  <text x="500" y="114" text-anchor="middle" font-size="13" fill="#374151">the same code can run on any board with a good BSP</text>

  <!-- ===== BSP panel ===== -->
  <rect x="245" y="142" width="510" height="330" rx="14" fill="#fffaf2" stroke="#e08a00" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="265" y="166" font-size="14" font-weight="700" fill="#b86e00">THE BSP (board-specific software)</text>

  <rect x="265" y="178" width="470" height="82" rx="10" fill="#ffffff" stroke="#e08a00" stroke-width="2"/>
  <text x="500" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Root filesystem</text>
  <text x="500" y="230" text-anchor="middle" font-size="13" fill="#374151">init system, libraries, firmware files,</text>
  <text x="500" y="248" text-anchor="middle" font-size="13" fill="#374151">board startup scripts, tools</text>

  <rect x="265" y="272" width="470" height="92" rx="10" fill="#ffffff" stroke="#e08a00" stroke-width="2"/>
  <text x="500" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Linux kernel</text>
  <text x="500" y="320" text-anchor="middle" font-size="13" fill="#374151">kernel config + board drivers</text>
  <rect x="330" y="330" width="340" height="26" rx="6" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.5"/>
  <text x="500" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4f8f">Device tree: describes THIS board's hardware</text>

  <rect x="265" y="376" width="470" height="82" rx="10" fill="#ffffff" stroke="#e08a00" stroke-width="2"/>
  <text x="500" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Bootloader</text>
  <text x="500" y="428" text-anchor="middle" font-size="13" fill="#374151">SPL + U-Boot (and TF-A on 64-bit Arm)</text>
  <text x="500" y="446" text-anchor="middle" font-size="13" fill="#374151">DDR init, clocks, loads the kernel</text>

  <!-- ===== Hardware ===== -->
  <rect x="260" y="488" width="480" height="70" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
  <text x="500" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Your hardware</text>
  <text x="500" y="538" text-anchor="middle" font-size="13" fill="#374151">SoC, DDR memory, PMIC, eMMC / SD, Ethernet, sensors</text>

  <!-- ===== Left: build system ===== -->
  <rect x="25" y="142" width="195" height="330" rx="14" fill="#f5f9ff" stroke="#2f6fbe" stroke-width="2"/>
  <text x="122" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4f8f">Build system</text>
  <text x="122" y="204" text-anchor="middle" font-size="13" fill="#374151">Yocto BSP layer</text>
  <text x="122" y="222" text-anchor="middle" font-size="13" fill="#374151">(meta-myboard)</text>
  <text x="122" y="248" text-anchor="middle" font-size="13" fill="#374151">or Buildroot</text>
  <text x="122" y="266" text-anchor="middle" font-size="13" fill="#374151">board config</text>
  <line x1="55" y1="290" x2="190" y2="290" stroke="#c7d6ea"/>
  <text x="122" y="316" text-anchor="middle" font-size="13" fill="#374151">cross-compiler</text>
  <text x="122" y="334" text-anchor="middle" font-size="13" fill="#374151">toolchain</text>
  <line x1="55" y1="358" x2="190" y2="358" stroke="#c7d6ea"/>
  <text x="122" y="384" text-anchor="middle" font-size="13" fill="#374151">builds every layer</text>
  <text x="122" y="402" text-anchor="middle" font-size="13" fill="#374151">from source, the</text>
  <text x="122" y="420" text-anchor="middle" font-size="13" fill="#374151">same way every time</text>
  <line x1="220" y1="307" x2="241" y2="307" stroke="#2f6fbe" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== Right: outputs ===== -->
  <rect x="780" y="142" width="195" height="330" rx="14" fill="#f3fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="877" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6b47">What it produces</text>
  <text x="800" y="206" font-size="13" fill="#1f2937">• SPL / MLO</text>
  <text x="800" y="234" font-size="13" fill="#1f2937">• u-boot.img</text>
  <text x="800" y="262" font-size="13" fill="#1f2937">• zImage / Image (kernel)</text>
  <text x="800" y="290" font-size="13" fill="#1f2937">• myboard.dtb</text>
  <text x="800" y="318" font-size="13" fill="#1f2937">• kernel modules</text>
  <text x="800" y="346" font-size="13" fill="#1f2937">• rootfs.ext4</text>
  <text x="800" y="374" font-size="13" fill="#1f2937">• sdcard.img / .wic</text>
  <text x="800" y="402" font-size="13" fill="#1f2937">• SDK for app developers</text>
  <line x1="759" y1="307" x2="776" y2="307" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== Bottom message ===== -->
  <rect x="25" y="580" width="950" height="50" rx="12" fill="#0f1b2d"/>
  <text x="500" y="611" text-anchor="middle" font-size="16" fill="#f6f7f4"><tspan font-weight="700" fill="#f0a23b">BSP</tspan> = everything board-specific that lets standard Linux boot and run on YOUR hardware</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="610" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Layers: stack them, and a higher layer can change a lower one</text>
<rect x="40" y="70" width="500" height="70" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="3"/>
<text x="290" y="99" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">meta-mycompany  (YOURS)</text>
<text x="290" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">your app recipes, .bbappends, image, distro settings</text>
<rect x="40" y="150" width="500" height="70" rx="10" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="290" y="179" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">BSP layer: meta-freescale / meta-ti / meta-raspberrypi</text>
<text x="290" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">machine configs, U-Boot, kernel, firmware</text>
<rect x="40" y="230" width="500" height="70" rx="10" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="290" y="259" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">meta-openembedded</text>
<text x="290" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">meta-oe, meta-python, meta-networking ...</text>
<rect x="40" y="310" width="500" height="70" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="290" y="339" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">meta-poky</text>
<text x="290" y="362" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">reference distro policy (DISTRO = "poky")</text>
<rect x="40" y="390" width="500" height="70" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="290" y="419" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">bitbake + meta (OE-core)</text>
<text x="290" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">core recipes: glibc, busybox, systemd, openssl ...</text>
<rect x="30" y="306" width="520" height="148" rx="12" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="560" y="450" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7280">poky</text>
<line x1="18" y1="460" x2="18" y2="76" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrow)"/>
<text x="12" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2e8b57" transform="rotate(-90 12 270)" text-anchor="middle">higher = applied later, wins</text>
<rect x="610" y="70" width="370" height="310" rx="12" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/>
<text x="795" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Inside your layer</text>
<text x="630" y="126" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">meta-mycompany/</text>
<text x="630" y="152" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">├─ conf/layer.conf</text>
<text x="630" y="178" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">├─ recipes-apps/collector/</text>
<text x="630" y="204" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">│   ├─ collector_1.0.bb</text>
<text x="630" y="230" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">│   └─ files/collector.c</text>
<text x="630" y="256" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">├─ recipes-kernel/linux/</text>
<text x="630" y="282" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">│   └─ linux-imx_%.bbappend</text>
<text x="630" y="308" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">└─ recipes-images/images/</text>
<text x="630" y="334" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">    └─ gateway-image.bb</text>
<rect x="610" y="396" width="370" height="110" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="795" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2e8b57">What a .bbappend does</text>
<text x="795" y="444" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#1f2937">linux-imx_%.bbappend in YOUR layer</text>
<text x="795" y="464" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">adds your device tree and config to the</text>
<text x="795" y="482" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">kernel recipe from the vendor's layer,</text>
<text x="795" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">without copying or editing it</text>
<rect x="40" y="530" width="940" height="64" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="510" y="557" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c0392b">Golden rule: never edit poky or the vendor's layers.</text>
<text x="510" y="579" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">Put every change in your own layer, so upgrading the others stays easy.</text>
</svg>

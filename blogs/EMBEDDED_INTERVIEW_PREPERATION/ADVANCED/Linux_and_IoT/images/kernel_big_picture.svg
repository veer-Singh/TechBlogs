<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="650" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">The Linux kernel: the manager between programs and hardware</text>
<text x="70" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e8b57">USER SPACE</text>
<text x="70" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">unprivileged (EL0)</text>
<text x="70" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a00">KERNEL SPACE</text>
<text x="70" y="378" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">privileged (EL1)</text>
<text x="70" y="548" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280">HARDWARE</text>
<rect x="135" y="62" width="840" height="100" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<rect x="150" y="72" width="190" height="40" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="245" y="97" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Your application</text>
<rect x="355" y="72" width="190" height="40" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="450" y="97" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Shell (bash)</text>
<rect x="560" y="72" width="190" height="40" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="655" y="97" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">systemd + services</text>
<rect x="765" y="72" width="190" height="40" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="860" y="97" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Qt / web UI</text>
<rect x="150" y="120" width="805" height="32" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="552" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">C library (glibc / musl): turns printf(), fopen() ... into system calls</text>
<rect x="135" y="172" width="840" height="42" rx="10" fill="#0f1b2d"/>
<text x="555" y="199" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f6f7f4">System call interface:  open · read · write · ioctl · mmap · socket · fork · execve</text>
<rect x="135" y="224" width="840" height="282" rx="14" fill="#fffaf2" stroke="#e08a00" stroke-width="2.5" stroke-dasharray="8 5"/>
<rect x="150" y="238" width="260" height="94" rx="10" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="280" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Process management</text>
<text x="280" y="302" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">scheduler, tasks, threads, signals</text>
<rect x="425" y="238" width="260" height="94" rx="10" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="555" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Memory management</text>
<text x="555" y="302" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">virtual memory, page tables, allocators</text>
<rect x="700" y="238" width="260" height="94" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/>
<text x="830" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">VFS + filesystems</text>
<text x="830" y="302" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">ext4, squashfs, procfs, sysfs</text>
<rect x="150" y="344" width="260" height="94" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="280" y="384" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Networking</text>
<text x="280" y="408" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">sockets, TCP/IP, netfilter, Wi-Fi</text>
<rect x="425" y="344" width="260" height="94" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="555" y="384" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Device drivers</text>
<text x="555" y="408" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">UART, I2C, SPI, GPIO, USB, Ethernet ...</text>
<rect x="700" y="344" width="260" height="94" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="830" y="384" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">IPC + security</text>
<text x="830" y="408" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">pipes, shared memory, namespaces, LSM</text>
<rect x="150" y="452" width="810" height="42" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="555" y="478" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Architecture code (arch/arm64): boot, MMU setup, exceptions and interrupts, context switch</text>
<rect x="135" y="520" width="840" height="58" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="555" y="555" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">CPU cores  ·  RAM  ·  storage (eMMC, SD, NAND)  ·  network  ·  peripherals</text>
<rect x="25" y="592" width="950" height="44" rx="12" fill="#0f1b2d"/>
<text x="500" y="620" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#f6f7f4"><tspan font-weight="700" fill="#f0a23b">Rule:</tspan> programs never touch hardware directly. They ask the kernel through system calls.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 391" width="1000" height="391"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="391.0" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">"Everything is a file": one interface, many kinds of files</text>
<rect x="200.0" y="66.0" width="600.0" height="76.3" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="97.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Application: open() / read() / write()</text>
<text x="500.0" y="126.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d3e0">→ the VFS, one common interface for all of them</text>

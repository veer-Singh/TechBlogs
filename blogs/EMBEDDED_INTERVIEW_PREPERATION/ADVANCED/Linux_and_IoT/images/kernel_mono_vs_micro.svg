<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="470" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Monolithic kernel vs microkernel: where do the drivers live?</text>
<rect x="20.0" y="60.0" width="470.0" height="390.0" rx="14" fill="#ffffff" stroke="#2f6fbe" stroke-width="2"/>
<text x="255.0" y="90.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6fbe">Monolithic kernel (Linux)</text>
<rect x="510.0" y="60.0" width="470.0" height="390.0" rx="14" fill="#ffffff" stroke="#7b3fbf" stroke-width="2"/>
<text x="745.0" y="90.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7b3fbf">Microkernel (QNX, seL4)</text>
<rect x="60.0" y="110.0" width="390.0" height="56.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="255.0" y="130.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Apps</text>
<text x="255.0" y="156.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">user space</text>
<line x1="255.0" y1="166.0" x2="255.0" y2="196.0" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="40" y1="182" x2="470" y2="182" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="460.0" y="178.0" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280">user / kernel boundary</text>
<rect x="60.0" y="200.0" width="390.0" height="200.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="255.0" y="266.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">ONE big kernel</text>
<text x="255.0" y="294.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">scheduler · memory · filesystems</text>
<text x="255.0" y="312.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">network stack</text>
<text x="255.0" y="329.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">ALL drivers</text>
<text x="255.0" y="347.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">everything runs in kernel mode</text>
<text x="255.0" y="432.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c0392b">fast, but one driver bug can crash everything</text>
<rect x="550.0" y="110.0" width="390.0" height="56.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="745.0" y="130.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Apps</text>
<text x="745.0" y="156.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">user space</text>
<line x1="745.0" y1="166.0" x2="745.0" y2="186.0" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="550.0" y="190.0" width="390.0" height="110.0" rx="12" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/>
<text x="745.0" y="220.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Servers in user space</text>
<text x="745.0" y="246.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">filesystem server · network server</text>
<text x="745.0" y="263.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">driver processes</text>
<text x="745.0" y="281.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">(each can crash and restart alone)</text>
<line x1="745.0" y1="300.0" x2="745.0" y2="330.0" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="530" y1="316" x2="960" y2="316" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="950.0" y="312.0" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280">user / kernel boundary</text>
<rect x="550.0" y="334.0" width="390.0" height="70.0" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="745.0" y="361.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Tiny kernel</text>
<text x="745.0" y="387.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">scheduling · memory · message passing</text>
<text x="745.0" y="432.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7b3fbf">isolated and small, but messages cost time</text>
</svg>

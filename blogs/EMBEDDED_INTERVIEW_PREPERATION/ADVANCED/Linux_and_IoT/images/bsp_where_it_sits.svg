<text x="500.0" y="275.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">startup scripts, firmware files</text>
<line x1="500.0" y1="288.0" x2="500.0" y2="302.0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<text x="500.0" y="431.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">SPL, U-Boot, TF-A: starts the board</text>
<line x1="500.0" y1="444.0" x2="500.0" y2="458.0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

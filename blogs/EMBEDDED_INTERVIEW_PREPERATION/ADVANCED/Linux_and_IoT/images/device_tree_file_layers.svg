<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="460" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">The device tree files: shared parts are included, the board adds its own</text>
<rect x="20.0" y="84.0" width="280.0" height="128.0" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="160.0" y="123.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">soc.dtsi (from the chip vendor)</text>
<text x="160.0" y="148.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">everything INSIDE the chip:</text>
<text x="160.0" y="165.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">CPUs, UARTs, I2C, SPI, GPIO, clocks</text>
<text x="160.0" y="183.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">most blocks: status = "disabled"</text>
<circle cx="22" cy="86" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="91.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
<rect x="360.0" y="84.0" width="280.0" height="128.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="500.0" y="131.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">som.dtsi (optional)</text>
<text x="500.0" y="157.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">a module that many boards share:</text>
<text x="500.0" y="174.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">memory size, PMIC, eMMC</text>
<circle cx="362" cy="86" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="362.0" y="91.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
<line x1="332.0" y1="148.0" x2="355.0" y2="148.0" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="296.6" y="59.0" width="66.7" height="22" rx="11" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="330.0" y="74.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7280">#include</text>
<rect x="700.0" y="84.0" width="280.0" height="128.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="840.0" y="123.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">board.dts (written by you)</text>
<text x="840.0" y="148.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">#include the .dtsi files</text>
<text x="840.0" y="165.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">turns on what THIS board uses</text>
<text x="840.0" y="183.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">adds chips outside the SoC</text>
<circle cx="702" cy="86" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="702.0" y="91.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
<line x1="672.0" y1="148.0" x2="695.0" y2="148.0" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="636.6" y="59.0" width="66.7" height="22" rx="11" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="670.0" y="74.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7280">#include</text>
<line x1="840.0" y1="214.0" x2="840.0" y2="268.0" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="841.0" y="231.0" width="78.0" height="22" rx="11" fill="#ffffff" stroke="#d97d00" stroke-width="1.5"/>
<text x="880.0" y="246.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97d00">cpp + dtc</text>
<rect x="700.0" y="272.0" width="280.0" height="90.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="840.0" y="300.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">board.dtb</text>
<text x="840.0" y="326.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">one binary for this board</text>
<text x="840.0" y="344.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">(all the files merged)</text>
<circle cx="702" cy="274" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="702.0" y="279.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
<rect x="20.0" y="272.0" width="480.0" height="90.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="260.0" y="300.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">board-overlay.dtbo (optional)</text>
<text x="260.0" y="326.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">a patch for an add-on board, a display or a HAT; applied on top of</text>
<text x="260.0" y="344.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">board.dtb at boot</text>
<circle cx="22" cy="274" r="14" fill="#2e8b57" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="279.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
<line x1="502.0" y1="317.0" x2="695.0" y2="317.0" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<rect x="549.4" y="286.0" width="103.3" height="22" rx="11" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="601.0" y="301.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2e8b57">applied on top</text>
<rect x="20.0" y="382.0" width="960.0" height="58.0" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="403.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Rule: a later file wins</text>
<text x="500.0" y="428.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">if the same property is set twice, the value in the file included LAST (or in the overlay) is used</text>
</svg>

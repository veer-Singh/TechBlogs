<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="640" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">A recipe's tasks: from source code to packages in the image</text>
<rect x="10" y="64" width="112" height="84" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="66" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">do_fetch</text>
<text x="66" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">download</text>
<text x="66" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">source</text>
<line x1="122" y1="106" x2="132" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="134" y="64" width="112" height="84" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="190" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">do_unpack</text>
<text x="190" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">extract</text>
<text x="190" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">into WORKDIR</text>
<line x1="246" y1="106" x2="256" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="258" y="64" width="112" height="84" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="314" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">do_patch</text>
<text x="314" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">apply</text>
<text x="314" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">patches</text>
<line x1="370" y1="106" x2="380" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="382" y="64" width="112" height="84" rx="10" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="438" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">do_configure</text>
<text x="438" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">cmake,</text>
<text x="438" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">./configure</text>
<line x1="494" y1="106" x2="504" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="506" y="64" width="112" height="84" rx="10" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="562" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">do_compile</text>
<text x="562" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">build with the</text>
<text x="562" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">cross-compiler</text>
<line x1="618" y1="106" x2="628" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630" y="64" width="112" height="84" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="686" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">do_install</text>
<text x="686" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">copy results</text>
<text x="686" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">into ${D}</text>
<line x1="742" y1="106" x2="752" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="754" y="64" width="112" height="84" rx="10" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="810" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">do_package</text>
<text x="810" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">split into</text>
<text x="810" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">packages</text>
<line x1="866" y1="106" x2="876" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="878" y="64" width="112" height="84" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="934" y="90" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">image</text>
<text x="934" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">do_rootfs puts</text>
<text x="934" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">them in the image</text>
<text x="500" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">BitBake runs these for every recipe, in dependency order, many recipes at once. Finished results go into the sstate cache.</text>
<rect x="20" y="190" width="600" height="432" rx="12" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/>
<text x="320" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Where things land in the build directory</text>
<text x="40" y="246" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">build/</text>
<text x="40" y="272" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">├─ conf/</text>
<text x="360" y="272" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">local.conf, bblayers.conf</text>
<text x="40" y="298" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">├─ downloads/</text>
<text x="360" y="298" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7280">← do_fetch  (DL_DIR)</text>
<text x="40" y="324" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">├─ sstate-cache/</text>
<text x="360" y="324" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">reusable task results</text>
<text x="40" y="350" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">└─ tmp/</text>
<text x="40" y="376" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">   ├─ work/&lt;arch&gt;/collector/1.0/</text>
<text x="40" y="402" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">   │   ├─ sources</text>
<text x="360" y="402" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7280">${S}   after do_unpack</text>
<text x="40" y="428" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">   │   ├─ build/</text>
<text x="360" y="428" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f6fbe">${B}   do_compile output</text>
<text x="40" y="454" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">   │   ├─ image/</text>
<text x="360" y="454" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e08a00">${D}   do_install result</text>
<text x="40" y="480" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">   │   ├─ packages-split/</text>
<text x="360" y="480" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7b3fbf">one folder per package</text>
<text x="40" y="506" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">   │   └─ temp/</text>
<text x="360" y="506" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">log.do_&lt;task&gt;: READ THESE</text>
<text x="40" y="532" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">   └─ deploy/</text>
<text x="40" y="558" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">       ├─ ipk/  (or rpm/, deb/)</text>
<text x="360" y="558" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7b3fbf">the packages</text>
<text x="40" y="584" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">       └─ images/&lt;machine&gt;/</text>
<text x="360" y="584" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2e8b57">flashable images</text>
<rect x="640" y="190" width="340" height="290" rx="12" fill="#f6f9fe" stroke="#2f6fbe" stroke-width="1.5"/>
<text x="810" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2f6fbe">Variables you'll use in recipes</text>
<text x="660" y="246" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${PN} / ${PV}</text>
<text x="820" y="246" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">package name / version</text>
<text x="660" y="274" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${S}</text>
<text x="820" y="274" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">source directory</text>
<text x="660" y="302" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${B}</text>
<text x="820" y="302" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">build directory</text>
<text x="660" y="330" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${D}</text>
<text x="820" y="330" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">install root (fake /)</text>
<text x="660" y="358" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${bindir}</text>
<text x="820" y="358" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">/usr/bin</text>
<text x="660" y="386" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${sysconfdir}</text>
<text x="820" y="386" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">/etc</text>
<text x="660" y="414" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${libdir}</text>
<text x="820" y="414" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">/usr/lib</text>
<text x="660" y="442" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">${CC} ${CFLAGS}</text>
<text x="820" y="442" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">cross-compiler + flags</text>
<rect x="640" y="494" width="340" height="128" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="810" y="520" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">When a build fails</text>
<text x="810" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937">1. read the error line BitBake prints</text>
<text x="810" y="566" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937">2. open WORKDIR/temp/log.do_&lt;task&gt;</text>
<text x="810" y="586" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#1f2937">3. bitbake -c devshell &lt;recipe&gt;</text>
<text x="810" y="606" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937">to try the fix by hand</text>
</svg>

<line x1="838" y1="330" x2="810" y2="330" stroke="#7b3fbf" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="380" y="540" width="600" height="84" rx="12" fill="#0f1b2d"/>
<text x="680" y="566" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0a23b">No central coordinator: every node picks its own route to a sink.</text>
<text x="680" y="588" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6edf3">More sinks = more capacity and redundancy. Uplink data goes to ANY sink;</text>
<text x="680" y="606" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6edf3">downlink (commands, config, firmware) comes from the sinks.</text>

<text x="240.0" y="446.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">weak (&lt; -85 dBm) → coverage: add routers, better antenna</text>
<text x="240.0" y="463.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">strong, but losses → interference / congestion: change</text>
<text x="240.0" y="481.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">channel, add sinks</text>
<text x="240.0" y="498.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">OK, only slow → too many hops / low-energy mode: add sinks</text>

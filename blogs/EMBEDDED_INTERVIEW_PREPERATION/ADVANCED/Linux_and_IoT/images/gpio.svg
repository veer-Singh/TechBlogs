<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="600" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">GPIO: one pin, one bit: output, input, or interrupt</text>
<rect x="25" y="62" width="300" height="270" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="175" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Output: push-pull</text>
<text x="175" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">Pin drives HIGH and LOW</text>
<rect x="350" y="62" width="300" height="270" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Output: open-drain</text>
<text x="500" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">Pin can only pull LOW</text>
<rect x="675" y="62" width="300" height="270" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="825" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Input with pull-up</text>
<text x="825" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">Released = 1, pressed = 0</text>
<rect x="45" y="170" width="70" height="40" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="80" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">GPIO</text>
<line x1="115" y1="190" x2="150" y2="190" stroke="#1f2937" stroke-width="2"/>
<rect x="150" y="182" width="50" height="16" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="175.0" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">330 Ω</text>
<line x1="200" y1="190" x2="230" y2="190" stroke="#1f2937" stroke-width="2"/>
<polygon points="230,176 230,204 256,190" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<line x1="256" y1="176" x2="256" y2="204" stroke="#c0392b" stroke-width="2.5"/>
<text x="243" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#c0392b">LED</text>
<line x1="256" y1="190" x2="280" y2="190" stroke="#1f2937" stroke-width="2"/>
<line x1="280" y1="190" x2="280" y2="230" stroke="#1f2937" stroke-width="2"/>
<line x1="280" y1="230" x2="280" y2="240" stroke="#1f2937" stroke-width="2"/>
<line x1="266" y1="240" x2="294" y2="240" stroke="#1f2937" stroke-width="2"/>
<line x1="271" y1="245" x2="289" y2="245" stroke="#1f2937" stroke-width="2"/>
<line x1="276" y1="250" x2="284" y2="250" stroke="#1f2937" stroke-width="2"/>
<text x="175" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">1 → LED on, 0 → LED off</text>
<text x="175" y="305" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#6b7280">Linux: gpioset gpiochip0 17=1</text>
<line x1="500" y1="128" x2="500" y2="140" stroke="#c0392b" stroke-width="2"/>
<text x="500" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#c0392b">3.3 V</text>
<rect x="492" y="140" width="16" height="36" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="514" y="162.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">pull-up</text>
<line x1="500" y1="176" x2="500" y2="200" stroke="#1f2937" stroke-width="2"/>
<line x1="390" y1="200" x2="620" y2="200" stroke="#2e8b57" stroke-width="3"/>
<text x="620" y="190" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2e8b57">shared line</text>
<line x1="420" y1="200" x2="420" y2="225" stroke="#1f2937" stroke-width="2"/>
<rect x="388" y="225" width="64" height="34" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="420" y="247" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">GPIO A</text>
<line x1="550" y1="200" x2="550" y2="225" stroke="#1f2937" stroke-width="2"/>
<rect x="518" y="225" width="64" height="34" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="550" y="247" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">GPIO B</text>
<text x="500" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Anyone can pull it low; nobody fights</text>
<text x="500" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Used for I2C, shared IRQ, reset lines</text>
<text x="765" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#c0392b">3.3 V</text>
<line x1="765" y1="138" x2="765" y2="146" stroke="#c0392b" stroke-width="2"/>
<rect x="757" y="146" width="16" height="36" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="779" y="168.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">10 kΩ</text>
<line x1="765" y1="182" x2="765" y2="200" stroke="#1f2937" stroke-width="2"/>
<line x1="765" y1="200" x2="865" y2="200" stroke="#1f2937" stroke-width="2"/>
<rect x="865" y="182" width="70" height="36" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="900" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">GPIO</text>
<line x1="765" y1="200" x2="765" y2="215" stroke="#1f2937" stroke-width="2"/>
<line x1="765" y1="215" x2="747" y2="232" stroke="#1f2937" stroke-width="2"/>
<circle cx="765" cy="215" r="3" fill="#1f2937"/><circle cx="765" cy="238" r="3" fill="#1f2937"/>
<text x="735" y="232" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">button</text>
<line x1="765" y1="238" x2="765" y2="248" stroke="#1f2937" stroke-width="2"/>
<line x1="765" y1="248" x2="765" y2="258" stroke="#1f2937" stroke-width="2"/>
<line x1="751" y1="258" x2="779" y2="258" stroke="#1f2937" stroke-width="2"/>
<line x1="756" y1="263" x2="774" y2="263" stroke="#1f2937" stroke-width="2"/>
<line x1="761" y1="268" x2="769" y2="268" stroke="#1f2937" stroke-width="2"/>
<text x="825" y="285" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#6b7280">Read it: gpioget gpiochip0 27</text>
<text x="825" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Pull-up can be inside the SoC</text>
<rect x="25" y="350" width="950" height="235" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="376" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Input events: a real button bounces; interrupts fire on edges</text>
<text x="140" y="424" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fbe">raw pin</text>
<text x="140" y="494" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2e8b57">debounced</text>
<polyline points="160,405 240,405 240,405 240,440 248,440 248,440 248,405 254,405 254,405 254,440 264,440 264,440 264,405 270,405 270,405 270,440 410,440 410,440 410,405 418,405 418,405 418,440 424,440 424,440 424,405 432,405 432,405 432,440 438,440 438,440 438,405 678,405" fill="none" stroke="#2f6fbe" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="160,475 270,475 270,475 270,510 462,510 462,510 462,475 678,475 678,475 678,475" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/>
<text x="233" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c0392b">bounces</text>
<line x1="270" y1="470" x2="270" y2="520" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="270" y="538" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c0392b">falling edge → IRQ</text>
<line x1="462" y1="470" x2="462" y2="520" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="462" y="538" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c0392b">rising edge → IRQ</text>
<text x="830" y="440" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Debounce: wait 10-20 ms</text>
<text x="830" y="458" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">for the level to settle</text>
<text x="830" y="494" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#6b7280">Linux: gpiomon gpiochip0 27</text>
<text x="500" y="568" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">Check the voltage level (1.8 V or 3.3 V) and the current limit (a few mA) before connecting anything</text>
</svg>

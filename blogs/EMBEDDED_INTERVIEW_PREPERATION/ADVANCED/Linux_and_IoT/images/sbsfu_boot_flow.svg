<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 462" width="1000" height="462"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="461.54999999999995" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">What SBSFU does at every reset</text>
<rect x="20.0" y="78.0" width="289.3" height="89.8" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="164.7" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Check the protections</text>
<text x="164.7" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">RDP, WRP, PCROP, MPU as expected? start</text>
<text x="164.7" y="150.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the watchdog (IWDG)</text>
<circle cx="22.0" cy="80" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
<rect x="355.3" y="78.0" width="289.3" height="89.8" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="500.0" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Local update asked for?</text>
<text x="500.0" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">button held at reset → receive a .sfb</text>
<text x="500.0" y="150.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">over UART (YMODEM)</text>
<circle cx="357.3333333333333" cy="80" r="14" fill="#7b3fbf" stroke="#ffffff" stroke-width="2.5"/>
<text x="357.3" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
<line x1="313.3" y1="122.9" x2="350.3" y2="122.9" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="690.7" y="78.0" width="289.3" height="89.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="835.3" y="106.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">New firmware in slot 1?</text>
<text x="835.3" y="132.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">check signature and version, decrypt,</text>
<text x="835.3" y="150.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">check hash, install into slot 0</text>
<circle cx="692.6666666666666" cy="80" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="692.7" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
<line x1="648.7" y1="122.9" x2="685.7" y2="122.9" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="835.3,169.8 835.3,195.8 164.7,195.8 164.7,219.8" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="223.8" width="289.3" height="89.8" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="164.7" y="252.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Check the active firmware</text>
<text x="164.7" y="278.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">header signature (ECDSA) + SHA-256 of</text>
<text x="164.7" y="296.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the whole firmware</text>
<circle cx="22.0" cy="225.85" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="230.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
<rect x="355.3" y="223.8" width="289.3" height="89.8" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="500.0" y="252.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Lock the Secure Engine</text>
<text x="500.0" y="278.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">set the MPU so the app can't reach the</text>
<text x="500.0" y="296.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">SE or SBSFU</text>
<circle cx="357.3333333333333" cy="225.85" r="14" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
<text x="357.3" y="230.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
<line x1="313.3" y1="268.8" x2="350.3" y2="268.8" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="690.7" y="223.8" width="289.3" height="89.8" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="835.3" y="261.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Run the UserApp</text>
<text x="835.3" y="287.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">jump to the application in slot 0</text>
<circle cx="692.6666666666666" cy="225.85" r="14" fill="#2e8b57" stroke="#ffffff" stroke-width="2.5"/>
<text x="692.7" y="230.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">6</text>
<line x1="648.7" y1="268.8" x2="685.7" y2="268.8" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="20.0" y="347.7" width="960.0" height="89.8" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="376.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">If any check fails</text>
<text x="500.0" y="402.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">the bad image is erased, the old firmware stays in place, and the error is recorded; with no valid firmware at all, SBSFU waits for a</text>
<text x="500.0" y="420.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">local update</text>
</svg>

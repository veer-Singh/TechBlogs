<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 468" width="1000" height="468"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="468" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Inside a .dtb file (the Flattened Device Tree format)</text>
<rect x="200.0" y="72.0" width="600.0" height="64.0" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="96.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Header</text>
<text x="500.0" y="122.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">magic 0xd00dfeed, total size, offsets of the other blocks, version 17</text>
<rect x="200.0" y="144.0" width="600.0" height="64.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="500.0" y="168.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Memory reservation block</text>
<text x="500.0" y="194.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">RAM areas the kernel must NOT use (address + size pairs)</text>
<rect x="200.0" y="216.0" width="600.0" height="80.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="500.0" y="248.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Structure block</text>
<text x="500.0" y="274.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the tree itself: BEGIN_NODE, PROP, END_NODE tokens, one after another</text>
<rect x="200.0" y="304.0" width="600.0" height="64.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="500.0" y="328.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Strings block</text>
<text x="500.0" y="354.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">every property name stored once ("compatible", "reg" ...); PROP tokens point here</text>
<text x="180.0" y="104.0" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">start of file</text>
<text x="180.0" y="356.0" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">end of file</text>
<line x1="160.0" y1="116.0" x2="160.0" y2="342.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="820.0" y="180.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f6fbe">all numbers are</text>
<text x="820.0" y="196.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f6fbe">big-endian</text>
<text x="820.0" y="212.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f6fbe">32-bit values</text>
<rect x="20.0" y="390.0" width="960.0" height="58.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="500.0" y="411.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Why a binary format?</text>
<text x="500.0" y="436.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">small, needs no text parser, and the bootloader can read and patch it with a tiny library (libfdt)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="660" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Kubernetes architecture: a control plane that manages worker nodes</text>
<rect x="30" y="58" width="300" height="40" rx="10" fill="#0f1b2d"/>
<text x="180" y="83" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#e6edf3">you:  kubectl apply -f app.yaml</text>
<line x1="180" y1="98" x2="180" y2="150" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="112" width="450" height="330" rx="14" fill="#fbf8fe" stroke="#7b3fbf" stroke-width="2"/>
<text x="255" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#7b3fbf">CONTROL PLANE (the brain)</text>
<rect x="55" y="152" width="250" height="70" rx="10" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="180" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">API server</text>
<text x="180" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">the only front door</text>
<rect x="55" y="250" width="190" height="76" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="150" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">etcd</text>
<text x="150" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">database of the cluster's</text>
<text x="150" y="312" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">desired + actual state</text>
<rect x="55" y="345" width="190" height="76" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="150" y="371" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Scheduler</text>
<text x="150" y="391" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">picks a node for</text>
<text x="150" y="407" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">each new pod</text>
<rect x="270" y="250" width="190" height="76" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="365" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Controller manager</text>
<text x="365" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">keeps actual state</text>
<text x="365" y="312" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">= desired state</text>
<rect x="270" y="345" width="190" height="76" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="365" y="371" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Cloud controller</text>
<text x="365" y="391" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">load balancers, disks</text>
<text x="365" y="407" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">(in the cloud)</text>
<line x1="150" y1="222" x2="150" y2="248" stroke="#7b3fbf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="330" y1="222" x2="360" y2="248" stroke="#7b3fbf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="112" width="450" height="158" rx="14" fill="#f6f9fe" stroke="#2f6fbe" stroke-width="2"/>
<text x="545" y="136" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fbe">WORKER NODE 1</text>
<text x="945" y="136" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">a machine or gateway</text>
<rect x="540" y="148" width="132" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="606" y="167" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">kubelet</text>
<text x="606" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#374151">runs pods for the API server</text>
<rect x="682" y="148" width="132" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="748" y="167" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">kube-proxy</text>
<text x="748" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#374151">routes Service traffic</text>
<rect x="824" y="148" width="132" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="890" y="167" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">containerd</text>
<text x="890" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#374151">container runtime</text>
<rect x="540" y="206" width="132" height="50" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="606" y="226" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">Pod</text>
<text x="606" y="244" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#374151">collector</text>
<rect x="682" y="206" width="132" height="50" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="748" y="226" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">Pod</text>
<text x="748" y="244" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#374151">collector</text>
<rect x="824" y="206" width="132" height="50" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="890" y="226" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">Pod</text>
<text x="890" y="244" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#374151">broker</text>
<rect x="520" y="280" width="450" height="158" rx="14" fill="#f6f9fe" stroke="#2f6fbe" stroke-width="2"/>
<text x="545" y="304" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fbe">WORKER NODE 2</text>
<text x="945" y="304" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">a machine or gateway</text>
<rect x="540" y="316" width="132" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="606" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">kubelet</text>
<text x="606" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#374151">runs pods for the API server</text>
<rect x="682" y="316" width="132" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="748" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">kube-proxy</text>
<text x="748" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#374151">routes Service traffic</text>
<rect x="824" y="316" width="132" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="890" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937">containerd</text>
<text x="890" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#374151">container runtime</text>
<rect x="540" y="374" width="132" height="50" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="606" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">Pod</text>
<text x="606" y="412" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#374151">collector</text>
<rect x="682" y="374" width="132" height="50" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="748" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">Pod</text>
<text x="748" y="412" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#374151">collector</text>
<line x1="305" y1="175" x2="518" y2="170" stroke="#7b3fbf" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="305" y1="195" x2="518" y2="338" stroke="#7b3fbf" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="420" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7b3fbf">instructions</text>
<rect x="30" y="460" width="940" height="185" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="486" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">The core idea: you declare the DESIRED state, Kubernetes keeps making it true</text>
<rect x="60" y="504" width="250" height="90" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="185" y="532" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Desired state</text>
<text x="185" y="556" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937">replicas: 3</text>
<text x="185" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">(your YAML, in etcd)</text>
<rect x="375" y="504" width="250" height="90" rx="12" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="500" y="532" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Compare</text>
<text x="500" y="556" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">controller sees</text>
<text x="500" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">only 2 pods running</text>
<rect x="690" y="504" width="250" height="90" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="815" y="532" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Act</text>
<text x="815" y="556" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">start 1 more pod</text>
<text x="815" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">(or restart, reschedule)</text>
<line x1="310" y1="549" x2="373" y2="549" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="625" y1="549" x2="688" y2="549" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 815 594 C 815 614, 185 614, 185 598" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="500" y="636" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">repeat forever: a crashed pod or a dead node is replaced automatically</text>
</svg>

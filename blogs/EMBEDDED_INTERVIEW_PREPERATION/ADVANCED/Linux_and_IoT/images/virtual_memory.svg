<text x="500" y="553" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">A and B use the SAME virtual addresses but land on DIFFERENT physical pages, so neither can see the other's memory.</text>
<text x="500" y="574" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#374151">Shared code (libc) is stored once. The kernel is mapped into every process but only usable in kernel mode.</text>

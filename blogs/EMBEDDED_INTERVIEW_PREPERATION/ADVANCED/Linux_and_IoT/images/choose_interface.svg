<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 461" width="1000" height="461"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="461.0" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Which interface should I use?</text>
<rect x="200.0" y="66.0" width="600.0" height="76.3" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="97.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Where is the other device, and what does it need?</text>
<text x="500.0" y="126.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d3e0">blue = on the same board · purple = in another box</text>
<line x1="500.0" y1="142.3" x2="500.0" y2="172.3" stroke="#374151" stroke-width="2.2"/>
<rect x="20.0" y="202.3" width="226.5" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="34.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">GPIO</text>
<text x="34.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• same board</text>
<text x="34.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• a simple on/off or an</text>
<text x="34.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">interrupt</text>
<polyline points="500.0,172.3 133.2,172.3 133.2,198.3" fill="none" stroke="#2f6fbe" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="264.5" y="202.3" width="226.5" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="278.5" y="239.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">I2C</text>
<text x="278.5" y="265.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• same board</text>
<text x="278.5" y="283.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• many slow chips, few pins</text>
<polyline points="500.0,172.3 377.8,172.3 377.8,198.3" fill="none" stroke="#2f6fbe" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="509.0" y="202.3" width="226.5" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="523.0" y="239.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">SPI</text>
<text x="523.0" y="265.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• same board</text>
<text x="523.0" y="283.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• speed: flash, display, ADC</text>
<polyline points="500.0,172.3 622.2,172.3 622.2,198.3" fill="none" stroke="#2f6fbe" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="753.5" y="202.3" width="226.5" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="767.5" y="239.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">UART</text>
<text x="767.5" y="265.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• same board / short cable</text>
<text x="767.5" y="283.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• GPS, modem, debug console</text>
<polyline points="500.0,172.3 866.8,172.3 866.8,198.3" fill="none" stroke="#2f6fbe" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="142.2" y="327.6" width="226.5" height="107.3" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>

<text x="156.2" y="382.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• another box</text>
<text x="156.2" y="400.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• network, IP, cloud, high</text>
<text x="156.2" y="417.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">speed</text>
<rect x="386.8" y="327.6" width="226.5" height="107.3" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="400.8" y="356.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">RS-485 + Modbus</text>
<text x="400.8" y="382.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• another box</text>
<text x="400.8" y="400.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• industrial, long noisy</text>
<text x="400.8" y="417.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">cable, many devices</text>
<rect x="631.2" y="327.6" width="226.5" height="107.3" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="645.2" y="356.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">USB</text>
<text x="645.2" y="382.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• another box</text>
<text x="645.2" y="400.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• plug-and-play to a PC,</text>
<text x="645.2" y="417.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">storage</text>

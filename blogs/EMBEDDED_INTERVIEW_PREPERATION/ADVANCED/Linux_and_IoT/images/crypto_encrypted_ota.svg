<rect x="20.0" y="312.7" width="960.0" height="72.3" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="341.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Also: flash encryption at rest</text>
<text x="500.0" y="367.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">firmware in external flash is stored encrypted; hardware decrypts it on the fly with a key in eFuse; a flash dump shows only noise</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Reading file permissions: ls -l explained</text>
<rect x="40" y="58" width="920" height="46" rx="10" fill="#0f1b2d"/>
<text x="500" y="89" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="400" fill="#e6edf3">$ ls -l run.sh      -rwxr-x---  1  root  dev  4096  Sep 23 12:00  run.sh</text>

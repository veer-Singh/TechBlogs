<text x="548" y="200" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="#1f2937">-</text>
<rect x="576" y="160" width="48" height="60" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="600" y="200" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="#1f2937">-</text>
<text x="84.0" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">type</text>
<polyline points="60,230 60,238 108,238 108,230" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
<text x="84.0" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">- file, d dir,</text>
<text x="84.0" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">l link, c char dev</text>
<text x="204.0" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">owner (user)</text>
<polyline points="128,230 128,238 280,238 280,230" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
<text x="204.0" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">4 + 2 + 1</text>
<text x="204.0" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">= 7</text>
<text x="376.0" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">group</text>

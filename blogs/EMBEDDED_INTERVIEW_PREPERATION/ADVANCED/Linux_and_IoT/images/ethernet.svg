<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="640" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Ethernet: from the SoC to the cable, and what a frame looks like</text>
<rect x="30" y="80" width="150" height="60" rx="10" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="105.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">MAC</text>
<text x="105.0" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">inside the SoC</text>
<rect x="270" y="80" width="150" height="60" rx="10" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="345.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">PHY chip</text>
<text x="345.0" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">e.g. KSZ9031</text>
<rect x="500" y="80" width="130" height="60" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="565.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Magnetics</text>
<text x="565.0" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">isolation</text>
<rect x="700" y="80" width="110" height="60" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="755.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">RJ45</text>
<text x="755.0" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">jack</text>
<rect x="880" y="80" width="95" height="60" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="927.5" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Switch</text>
<line x1="180" y1="100" x2="268" y2="100" stroke="#7b3fbf" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="268" y1="118" x2="182" y2="118" stroke="#7b3fbf" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="224" y="72" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7b3fbf">RGMII / RMII</text>
<line x1="420" y1="110" x2="498" y2="110" stroke="#1f2937" stroke-width="2.5"/>
<line x1="630" y1="110" x2="698" y2="110" stroke="#1f2937" stroke-width="2.5"/>
<line x1="810" y1="110" x2="878" y2="110" stroke="#1f2937" stroke-width="3" stroke-dasharray="8 4"/>
<text x="845" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">cable</text>
<polyline points="105,140 105,165 345,165 345,140" fill="none" stroke="#e08a00" stroke-width="2" stroke-linejoin="round"/>
<text x="225" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e08a00">MDIO / MDC: management (link up? speed?)</text>
<text x="225" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Layer 2: builds and checks frames</text>
<text x="565" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Layer 1: turns bits into signals on the cable</text>
<rect x="20" y="230" width="960" height="200" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="256" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">An Ethernet II frame carrying an IPv4 packet</text>
<text x="88.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">7 B</text>
<rect x="40" y="290" width="96" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="88.0" y="320.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Preamble</text>
<text x="88.0" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#1f2937">55 55 … 55</text>
<text x="163.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">1 B</text>
<rect x="138" y="290" width="50" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="163.0" y="320.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">SFD</text>
<text x="163.0" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#1f2937">D5</text>
<text x="275.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">6 B</text>
<rect x="190" y="290" width="170" height="50" rx="6" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.8"/>
<text x="275.0" y="320.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Destination MAC</text>
<text x="275.0" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#1f2937">00:1A:2B:3C:4D:5E</text>
<text x="447.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">6 B</text>
<rect x="362" y="290" width="170" height="50" rx="6" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.8"/>
<text x="447.0" y="320.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Source MAC</text>
<text x="447.0" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#1f2937">02:42:AC:11:00:02</text>
<text x="589.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">2 B</text>
<rect x="534" y="290" width="110" height="50" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="1.8"/>
<text x="589.0" y="320.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">EtherType</text>
<text x="589.0" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#1f2937">0x0800 = IPv4</text>
<text x="761.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">46-1500 B</text>
<rect x="646" y="290" width="230" height="50" rx="6" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="761.0" y="320.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Payload</text>
<text x="761.0" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#1f2937">IP packet</text>
<text x="920.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">4 B</text>
<rect x="878" y="290" width="84" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="920.0" y="320.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">FCS</text>
<text x="920.0" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#1f2937">CRC-32</text>
<polyline points="40,372 40,378 188,378 188,372" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-linejoin="round"/>
<text x="114" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280">sync, not counted</text>
<polyline points="190,372 190,378 960,378 960,372" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-linejoin="round"/>
<text x="575" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">the frame: 64 to 1518 bytes (1522 with a VLAN tag)</text>
<text x="500" y="418" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">Other EtherTypes: 0x0806 ARP · 0x86DD IPv6 · 0x8100 VLAN tag · 0x88A4 EtherCAT</text>
<rect x="20" y="445" width="960" height="180" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Layers inside each other: a sensor reading on its way to the cloud</text>
<rect x="40" y="485" width="920" height="125" rx="10" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="60" y="505" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7b3fbf">Ethernet frame (layer 2)</text>
<rect x="60" y="513" width="800" height="88" rx="8" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="80" y="532" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e08a00">IP packet (layer 3): from 192.168.1.20 to 10.0.0.5</text>
<rect x="80" y="540" width="760" height="54" rx="8" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="100" y="558" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fbe">TCP segment (layer 4): to port 1883</text>
<rect x="420" y="546" width="400" height="40" rx="6" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="620" y="571" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2e8b57">MQTT message: "temp=23.5"  (application)</text>
<rect x="870" y="513" width="80" height="88" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="910" y="562" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">FCS</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Three settings decide what you build: MACHINE, DISTRO, IMAGE</text>
<rect x="20" y="60" width="307" height="370" rx="14" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="173" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7b3fbf">MACHINE</text>
<text x="173" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Which hardware?</text>
<rect x="36" y="134" width="275" height="34" rx="8" fill="#0f1b2d"/>
<text x="173" y="156" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e6edf3">MACHINE = "imx8mm-evk"</text>
<text x="173" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">defined in: conf/machine/*.conf (BSP layer)</text>
<text x="40" y="222" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">It decides:</text>
<text x="46" y="250" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• CPU tuning (e.g. Cortex-A53)</text>
<text x="46" y="276" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• which U-Boot and kernel</text>
<text x="46" y="302" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• device tree(s)</text>
<text x="46" y="328" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• serial console</text>
<text x="46" y="354" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• image format for this board</text>
<rect x="347" y="60" width="307" height="370" rx="14" fill="#fff3e0" stroke="#e08a00" stroke-width="2"/>
<text x="500" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e08a00">DISTRO</text>
<text x="500" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Which rules and policies?</text>
<rect x="363" y="134" width="275" height="34" rx="8" fill="#0f1b2d"/>
<text x="500" y="156" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e6edf3">DISTRO = "mydistro"</text>
<text x="500" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">defined in: conf/distro/*.conf (your layer)</text>
<text x="367" y="222" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">It decides:</text>
<text x="373" y="250" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• init system: systemd / sysvinit</text>
<text x="373" y="276" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• C library: glibc / musl</text>
<text x="373" y="302" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• DISTRO_FEATURES: wifi, bluetooth,</text>
<text x="373" y="328" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">    wayland, ipv6 ...</text>
<text x="373" y="354" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• security flags, package format</text>
<rect x="674" y="60" width="307" height="370" rx="14" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="827" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e8b57">IMAGE</text>
<text x="827" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Which software is on the device?</text>
<rect x="690" y="134" width="275" height="34" rx="8" fill="#0f1b2d"/>
<text x="827" y="156" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e6edf3">bitbake gateway-image</text>
<text x="827" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">defined in: images/*.bb (your layer)</text>
<text x="694" y="222" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">It decides:</text>
<text x="700" y="250" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• IMAGE_INSTALL: the packages</text>
<text x="700" y="276" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• IMAGE_FEATURES: ssh-server,</text>
<text x="700" y="302" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">    read-only-rootfs ...</text>
<text x="700" y="328" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• IMAGE_FSTYPES: wic, ext4</text>
<text x="700" y="354" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937">• users, passwords, root size</text>
<rect x="20" y="448" width="960" height="96" rx="14" fill="#0f1b2d"/>
<text x="500" y="478" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#f0a23b">MACHINE=imx8mm-evk  DISTRO=mydistro  bitbake gateway-image</text>
<text x="500" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f6f7f4">= one image, for THAT board, following THOSE rules, containing THAT software</text>
<text x="500" y="528" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">Change only MACHINE and rebuild: the same product software on a different board</text>
</svg>

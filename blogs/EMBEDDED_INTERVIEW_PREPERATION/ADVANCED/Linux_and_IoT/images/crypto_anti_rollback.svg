<line x1="479.0" y1="102.2" x2="518.0" y2="102.2" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="751.5,140.3 751.5,160.3 500.0,160.3 500.0,178.3" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="220.0" y="182.3" width="560.0" height="48.9" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="500.0" y="211.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2937">Is the image's counter (4) ≥ the device minimum (5)?</text>
<polyline points="500.0,233.2 500.0,261.2 256.0,261.2 256.0,323.2" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>

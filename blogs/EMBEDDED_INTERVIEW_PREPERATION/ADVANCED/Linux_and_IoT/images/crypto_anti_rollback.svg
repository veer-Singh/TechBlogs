<text x="256.0" y="289.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">NO: 4 is less than 5</text>
<rect x="20.0" y="327.2" width="472.0" height="70.3" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="256.0" y="355.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Reject: too old</text>
<text x="256.0" y="379.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">an old version with a known security hole can't come back</text>
<polyline points="500.0,233.2 500.0,261.2 744.0,261.2 744.0,323.2" fill="none" stroke="#2e8b57" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>

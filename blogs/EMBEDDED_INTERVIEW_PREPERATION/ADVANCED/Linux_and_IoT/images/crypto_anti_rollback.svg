<text x="751.5" y="120.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">minimum counter = 5 (can only go up)</text>
<circle cx="525.0" cy="68" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>

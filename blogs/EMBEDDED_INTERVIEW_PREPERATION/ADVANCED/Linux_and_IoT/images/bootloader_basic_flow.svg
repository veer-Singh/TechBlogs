<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="569.9" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">What a bootloader does after power-on</text>
<rect x="20.0" y="66.0" width="440.0" height="89.8" rx="12" fill="#0f1b2d"/>
<text x="240.0" y="94.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Power on → Boot ROM → bootloader</text>
<text x="240.0" y="120.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">the bootloader first wakes up the hardware: clocks, RAM,</text>
<text x="240.0" y="138.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">storage, console</text>
<line x1="240.0" y1="157.8" x2="240.0" y2="195.8" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="20.0" y="199.8" width="440.0" height="89.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="240.0" y="249.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Is an update requested?</text>
<circle cx="22" cy="201.85" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="206.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
<rect x="540.0" y="199.8" width="440.0" height="89.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="760.0" y="228.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Update mode</text>
<text x="760.0" y="254.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">receive the new firmware, write it, verify it, then check</text>
<text x="760.0" y="272.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">again</text>
<line x1="462.0" y1="244.8" x2="535.0" y2="244.8" stroke="#d97d00" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="481.0" y="217.8" width="38.0" height="22" rx="11" fill="#ffffff" stroke="#d97d00" stroke-width="1.5"/>
<text x="500.0" y="232.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97d00">YES</text>
<line x1="240.0" y1="291.7" x2="240.0" y2="329.7" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="264.3" y="300.7" width="31.3" height="22" rx="11" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="280.0" y="315.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2e8b57">NO</text>
<rect x="20.0" y="333.7" width="440.0" height="89.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="240.0" y="371.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Is the firmware valid?</text>
<text x="240.0" y="397.3" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">CRC / signature check</text>
<circle cx="22" cy="335.7" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="22.0" y="340.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
<rect x="540.0" y="333.7" width="440.0" height="89.8" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="760.0" y="362.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Recovery</text>
<text x="760.0" y="388.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">boot the backup image, or wait for new firmware; never run</text>
<text x="760.0" y="406.1" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">bad code</text>
<line x1="462.0" y1="378.6" x2="535.0" y2="378.6" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="484.3" y="351.6" width="31.3" height="22" rx="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="500.0" y="366.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">NO</text>
<line x1="240.0" y1="425.5" x2="240.0" y2="463.5" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="261.0" y="434.5" width="38.0" height="22" rx="11" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="280.0" y="449.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2e8b57">YES</text>
<rect x="20.0" y="467.5" width="440.0" height="72.3" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="240.0" y="496.3" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Load it (if needed) and hand over control</text>
<text x="240.0" y="522.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the Linux kernel or the IoT application starts running</text>
</svg>

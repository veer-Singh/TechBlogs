<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 461" width="1000" height="461"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="461.0" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Why do we need a bootloader? Five reasons</text>
<rect x="200.0" y="66.0" width="600.0" height="76.3" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="97.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Why a bootloader?</text>
<text x="500.0" y="126.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d3e0">five jobs no chip can do on its own</text>
<line x1="500.0" y1="142.3" x2="500.0" y2="172.3" stroke="#374151" stroke-width="2.2"/>
<rect x="20.0" y="202.3" width="308.0" height="107.3" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="34.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Hardware setup</text>
<text x="34.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• initialise DRAM</text>
<text x="34.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• set clocks and PMIC</text>
<text x="34.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• bring up storage</text>
<polyline points="500.0,172.3 174.0,172.3 174.0,198.3" fill="none" stroke="#2f6fbe" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="346.0" y="202.3" width="308.0" height="107.3" rx="12" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/>
<text x="360.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Loading</text>
<text x="360.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• find the kernel / firmware</text>
<text x="360.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• copy it into RAM</text>
<text x="360.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• pass device tree + bootargs</text>
<polyline points="500.0,172.3 500.0,172.3 500.0,198.3" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="672.0" y="202.3" width="308.0" height="107.3" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="686.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Updates</text>
<text x="686.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• OTA over Wi-Fi / LTE / BLE</text>
<text x="686.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• field update over UART / USB</text>
<text x="686.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• no debugger needed</text>
<polyline points="500.0,172.3 826.0,172.3 826.0,198.3" fill="none" stroke="#2e8b57" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="183.0" y="327.6" width="308.0" height="107.3" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="197.0" y="356.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Safety</text>
<text x="197.0" y="382.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• detect corrupted firmware</text>
<text x="197.0" y="400.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• roll back a bad update</text>
<text x="197.0" y="417.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• recover a bricked device</text>
<rect x="509.0" y="327.6" width="308.0" height="107.3" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="523.0" y="356.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Security</text>
<text x="523.0" y="382.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• run only signed firmware</text>
<text x="523.0" y="400.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• block old vulnerable versions</text>
<text x="523.0" y="417.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• protect keys and IP</text>
</svg>

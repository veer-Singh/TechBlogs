<line x1="212" y1="555" x2="316" y2="555" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="320" y="496" width="330" height="118" rx="14" fill="#0f6cbd"/>
<text x="485" y="530" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Azure Resource Manager (ARM)</text>
<text x="485" y="556" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6f0fb">checks WHO you are (Entra ID + RBAC)</text>
<text x="485" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6f0fb">checks WHAT is allowed (Azure Policy)</text>
<text x="485" y="596" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6f0fb">then creates / changes resources</text>

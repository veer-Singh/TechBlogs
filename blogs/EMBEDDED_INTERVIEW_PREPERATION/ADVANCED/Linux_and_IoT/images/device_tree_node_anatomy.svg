<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="460" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Anatomy of a device tree node</text>
<rect x="20.0" y="78.0" width="490.0" height="360.0" rx="12" fill="#f8fafc" stroke="#6b7280" stroke-width="2"/>
<text x="38.0" y="104.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">i2c1: i2c@30a20000 {</text>
<text x="38.0" y="131.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">    compatible = "fsl,imx8mm-i2c";</text>
<text x="38.0" y="158.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">    reg = &lt;0x30a20000 0x10000&gt;;</text>
<text x="38.0" y="185.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">    interrupts = &lt;GIC_SPI 35 IRQ_TYPE_LEVEL_HIGH&gt;;</text>
<text x="38.0" y="212.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">    status = "okay";</text>
<text x="38.0" y="239.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937"></text>
<text x="38.0" y="266.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">    sensor@48 {</text>
<text x="38.0" y="293.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">        compatible = "ti,tmp102";</text>
<text x="38.0" y="320.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">        reg = &lt;0x48&gt;;</text>
<text x="38.0" y="347.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">    };</text>
<text x="38.0" y="374.0" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">};</text>
<rect x="560.0" y="78.0" width="420.0" height="48.0" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="574.0" y="94.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Label i2c1:</text>
<text x="574.0" y="118.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">a nickname; other nodes point here with &amp;i2c1</text>
<circle cx="546" cy="102" r="14" fill="#7b3fbf" stroke="#ffffff" stroke-width="2.5"/>
<text x="546.0" y="107.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
<rect x="560.0" y="130.0" width="420.0" height="48.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="574.0" y="146.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Node name i2c@30a20000</text>
<text x="574.0" y="170.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">name@unit-address (the address = first value of reg)</text>
<circle cx="546" cy="154" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="546.0" y="159.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
<rect x="560.0" y="182.0" width="420.0" height="48.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="574.0" y="198.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Property name = value;</text>
<text x="574.0" y="222.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">compatible picks the driver</text>
<circle cx="546" cy="206" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="546.0" y="211.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
<rect x="560.0" y="234.0" width="420.0" height="48.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="574.0" y="250.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">reg</text>
<text x="574.0" y="274.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">where the device is: register address + size</text>
<circle cx="546" cy="258" r="14" fill="#d97d00" stroke="#ffffff" stroke-width="2.5"/>
<text x="546.0" y="263.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
<rect x="560.0" y="286.0" width="420.0" height="48.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="574.0" y="302.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">status</text>
<text x="574.0" y="326.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">"okay" = use it, "disabled" = skip it</text>
<circle cx="546" cy="310" r="14" fill="#2e8b57" stroke="#ffffff" stroke-width="2.5"/>
<text x="546.0" y="315.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
<rect x="560.0" y="338.0" width="420.0" height="48.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="574.0" y="354.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Child node sensor@48</text>
<text x="574.0" y="378.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">a device on this I2C bus, at address 0x48</text>
<circle cx="546" cy="362" r="14" fill="#2f6fbe" stroke="#ffffff" stroke-width="2.5"/>
<text x="546.0" y="367.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">6</text>
<rect x="560.0" y="390.0" width="420.0" height="48.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="574.0" y="406.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Every node and property ends with ;</text>
<text x="574.0" y="430.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">a missing ; is the most common dtc error</text>
<circle cx="546" cy="414" r="14" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
<text x="546.0" y="419.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">7</text>
</svg>

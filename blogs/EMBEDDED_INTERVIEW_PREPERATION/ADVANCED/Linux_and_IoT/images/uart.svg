<text x="202" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b">Start</text>
<line x1="234" y1="318" x2="234" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>

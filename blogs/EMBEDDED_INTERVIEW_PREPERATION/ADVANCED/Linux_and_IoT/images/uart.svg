<text x="266" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D0</text>
<line x1="298" y1="318" x2="298" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="330" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">0</text>
<text x="330" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D1</text>
<line x1="362" y1="318" x2="362" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="394" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">0</text>
<text x="394" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D2</text>
<line x1="426" y1="318" x2="426" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="458" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">0</text>
<text x="458" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D3</text>
<line x1="490" y1="318" x2="490" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="522" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">0</text>
<text x="522" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D4</text>
<line x1="554" y1="318" x2="554" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="586" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">0</text>
<text x="586" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D5</text>
<line x1="618" y1="318" x2="618" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="650" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">1</text>
<text x="650" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D6</text>
<line x1="682" y1="318" x2="682" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="714" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">0</text>
<text x="714" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">D7</text>
<line x1="746" y1="318" x2="746" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="778" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fbe">1</text>
<text x="778" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b">Stop</text>
<line x1="874" y1="318" x2="874" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<text x="130" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">idle</text>
<text x="130" y="396" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">(high)</text>
<text x="850" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">idle</text>
<polyline points="234,432 234,440 746,440 746,432" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
<text x="490.0" y="458" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">8 data bits, least significant bit (D0) first</text>
<text x="500" y="490" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#374151">Start bit (0) wakes the receiver · stop bit (1) ends the frame · 10 bits carry 1 byte</text>
<text x="500" y="510" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#374151">At 115200 baud, 1 bit ≈ 8.68 µs, so one frame ≈ 86.8 µs and the link moves about 11,520 bytes/s</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">UART: two data wires, no clock, one frame per byte</text>
<rect x="70" y="70" width="200" height="120" rx="10" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="170" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Device A</text>
<text x="170" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">MCU / SoC</text>
<rect x="730" y="70" width="200" height="120" rx="10" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="830" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Device B</text>
<text x="830" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">GPS, modem, USB-serial</text>
<text x="258" y="144" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">TX</text>
<text x="742" y="144" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">RX</text>
<text x="258" y="164" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">RX</text>
<text x="742" y="164" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">TX</text>
<text x="258" y="184" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">GND</text>
<text x="742" y="184" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">GND</text>
<line x1="270" y1="140" x2="728" y2="140" stroke="#2f6fbe" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="730" y1="160" x2="272" y2="160" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="270" y1="180" x2="730" y2="180" stroke="#6b7280" stroke-width="2.5"/>
<text x="500" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2f6fbe">A's TX → B's RX</text>
<text x="500" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57">B's TX → A's RX</text>
<text x="500" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">shared ground (reference)</text>
<text x="500" y="225" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937">No clock wire: both sides must agree on the settings in advance, e.g. 115200 baud, 8N1</text>
<rect x="30" y="250" width="940" height="270" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Sending the letter 'A' = 0x41 = 0100 0001 (binary), format 8N1</text>
<polyline points="90,330 170,330 170,330 170,390 234,390 234,390 234,330 298,330 298,330 298,390 362,390 362,390 426,390 426,390 490,390 490,390 554,390 554,390 618,390 618,390 618,330 682,330 682,330 682,390 746,390 746,390 746,330 810,330 810,330 890,330" fill="none" stroke="#2f6fbe" stroke-width="3" stroke-linejoin="round"/>
<line x1="170" y1="318" x2="170" y2="400" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>

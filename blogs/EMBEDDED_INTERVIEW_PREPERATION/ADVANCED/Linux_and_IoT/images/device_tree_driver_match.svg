<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 727" width="1000" height="727"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="727" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">How the kernel matches a device tree node to a driver</text>
<line x1="140.0" y1="124.0" x2="140.0" y2="691.0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="28.0" y="66.0" width="224.0" height="58.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="140.0" y="88.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Device tree (.dtb)</text>
<text x="140.0" y="112.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">node: compatible = "ti,tmp102"</text>
<line x1="380.0" y1="124.0" x2="380.0" y2="691.0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="268.0" y="66.0" width="224.0" height="58.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="380.0" y="88.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Kernel core</text>
<text x="380.0" y="112.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">unflattens the tree</text>
<line x1="620.0" y1="124.0" x2="620.0" y2="691.0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="508.0" y="66.0" width="224.0" height="58.0" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="620.0" y="88.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">Bus (I2C core)</text>
<text x="620.0" y="112.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">creates the devices</text>
<line x1="860.0" y1="124.0" x2="860.0" y2="691.0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="748.0" y="66.0" width="224.0" height="58.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="860.0" y="88.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">tmp102 driver</text>
<text x="860.0" y="112.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">of_match_table</text>
<line x1="140.0" y1="217.0" x2="376.0" y2="217.0" stroke="#d97d00" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="260.0" y="162.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">1. At boot the kernel reads the</text>
<text x="260.0" y="179.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">.dtb and builds a tree of</text>
<text x="260.0" y="196.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">device_node structures in RAM</text>
<line x1="380.0" y1="291.0" x2="616.0" y2="291.0" stroke="#2f6fbe" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500.0" y="253.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">2. For each enabled node on a bus,</text>
<text x="500.0" y="270.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">the bus creates a device</text>
<line x1="860.0" y1="382.0" x2="624.0" y2="382.0" stroke="#2e8b57" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="740.0" y="327.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">3. The driver registers with a</text>
<text x="740.0" y="344.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">list of compatible strings it</text>
<text x="740.0" y="361.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">supports</text>
<rect x="506.0" y="408.0" width="228.0" height="66.0" rx="8" fill="#fff3e0" stroke="#d97d00" stroke-width="1.5"/>
<text x="620.0" y="426.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">4. The bus compares the node's</text>
<text x="620.0" y="442.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">compatible strings with each</text>
<text x="620.0" y="458.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">driver's list</text>
<line x1="620.0" y1="534.0" x2="856.0" y2="534.0" stroke="#7b3fbf" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="740.0" y="496.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">5. Match found: the bus calls the</text>
<text x="740.0" y="513.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">driver's probe()</text>
<rect x="746.0" y="560.0" width="228.0" height="66.0" rx="8" fill="#fff3e0" stroke="#d97d00" stroke-width="1.5"/>
<text x="860.0" y="578.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">6. probe() reads reg, interrupts,</text>
<text x="860.0" y="594.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">clocks with of_* /</text>
<text x="860.0" y="610.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">device_property_* calls</text>
<rect x="40.0" y="638.0" width="920.0" height="35.0" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
<text x="500.0" y="657.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">The device appears in /dev and /sys. No match = no probe, often with no error message</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="580" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">SBSFU in the STM32 flash: three programs, each protected differently</text>
<text x="500.0" y="62.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151">A typical dual-slot layout; the exact order and sizes depend on the STM32 family</text>
<rect x="150.0" y="92.0" width="440.0" height="72.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="370.0" y="120.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Slot 1: download slot</text>
<text x="370.0" y="146.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the new firmware as received: encrypted .sfb</text>
<line x1="596.0" y1="128.0" x2="655.0" y2="128.0" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="100.0" width="320.0" height="56.0" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
<text x="820.0" y="131.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">UserApp writes here (OTA)</text>
<rect x="150.0" y="172.0" width="440.0" height="72.0" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="370.0" y="200.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Swap area</text>
<text x="370.0" y="226.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">temporary space while installing</text>
<line x1="596.0" y1="208.0" x2="655.0" y2="208.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="180.0" width="320.0" height="56.0" rx="12" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/>
<text x="820.0" y="211.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">a power cut can be resumed</text>
<rect x="150.0" y="252.0" width="440.0" height="72.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="370.0" y="280.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Slot 0: active slot → UserApp</text>
<text x="370.0" y="306.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">header + your running firmware (decrypted)</text>
<line x1="596.0" y1="288.0" x2="655.0" y2="288.0" stroke="#2f6fbe" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="260.0" width="320.0" height="56.0" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.5"/>
<text x="820.0" y="291.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">signature + hash checked at every boot</text>
<rect x="150.0" y="332.0" width="440.0" height="72.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="370.0" y="360.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">SBSFU: the bootloader</text>
<text x="370.0" y="386.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">state machine, install, local loader (YMODEM)</text>
<line x1="596.0" y1="368.0" x2="655.0" y2="368.0" stroke="#d97d00" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="340.0" width="320.0" height="56.0" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="1.5"/>
<text x="820.0" y="371.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">WRP: can't be erased or changed</text>
<rect x="150.0" y="412.0" width="440.0" height="72.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="370.0" y="440.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">SE: Secure Engine</text>
<text x="370.0" y="466.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">the keys + the crypto functions, one entry point</text>
<line x1="596.0" y1="448.0" x2="655.0" y2="448.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="420.0" width="320.0" height="56.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="820.0" y="443.6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">PCROP / Firewall / HDP + MPU: keys can't</text>
<text x="820.0" y="459.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">be read</text>
<text x="135.0" y="104.0" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">end of flash</text>
<text x="135.0" y="472.0" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">start of flash</text>
<text x="135.0" y="488.0" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#6b7280">0x0800 0000</text>
<line x1="110.0" y1="456.0" x2="110.0" y2="118.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="502.0" width="960.0" height="58.0" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="523.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Whole chip: RDP level 2 in production</text>
<text x="500.0" y="548.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c9d3e0">the debug port is switched off for good, so nobody can read the flash or attach a debugger</text>
</svg>

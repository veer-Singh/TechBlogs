<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" width="1000" height="514"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="513.5" rx="16" fill="#ffffff"/>
<text x="500.0" y="38.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">Type 2: by extra job. What else does the bootloader do?</text>
<rect x="200.0" y="66.0" width="600.0" height="76.3" rx="12" fill="#0f1b2d"/>
<text x="500.0" y="97.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Every bootloader starts the software</text>
<text x="500.0" y="126.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c9d3e0">many also do one or more of these extra jobs</text>
<line x1="500.0" y1="142.3" x2="500.0" y2="172.3" stroke="#374151" stroke-width="2.2"/>
<rect x="20.0" y="202.3" width="308.0" height="124.8" rx="12" fill="#fff3e0" stroke="#d97d00" stroke-width="2"/>
<text x="34.0" y="239.8" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">1. Update (DFU)</text>
<text x="34.0" y="265.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• receives and installs new firmware</text>
<text x="34.0" y="283.4" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• like: 'Installing update...' on a phone</text>
<text x="34.0" y="300.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• e.g. Arduino, STM32 ROM, USB DFU</text>
<polyline points="500.0,172.3 174.0,172.3 174.0,198.3" fill="none" stroke="#d97d00" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="346.0" y="202.3" width="308.0" height="124.8" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="360.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">2. Secure</text>
<text x="360.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• runs only firmware signed by the maker</text>
<text x="360.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• like: a locked phone refusing unofficial</text>
<text x="360.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">software</text>
<text x="360.0" y="309.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• e.g. ESP32 Secure Boot, MCUboot</text>
<polyline points="500.0,172.3 500.0,172.3 500.0,198.3" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="672.0" y="202.3" width="308.0" height="124.8" rx="12" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="2"/>
<text x="686.0" y="231.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">3. A/B dual-slot</text>
<text x="686.0" y="257.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• keeps two copies; if the new one fails,</text>
<text x="686.0" y="274.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">goes back to the old one</text>
<text x="686.0" y="292.2" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• like: a phone update that can't brick it</text>
<text x="686.0" y="309.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• e.g. ESP32 OTA, RAUC, Mender</text>
<polyline points="500.0,172.3 826.0,172.3 826.0,198.3" fill="none" stroke="#2f6fbe" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="183.0" y="345.1" width="308.0" height="142.3" rx="12" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="2"/>
<text x="197.0" y="373.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">4. Recovery</text>
<text x="197.0" y="400.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• a safe mode when the main firmware is</text>
<text x="197.0" y="417.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">broken</text>
<text x="197.0" y="435.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• like: phone recovery mode (Power +</text>
<text x="197.0" y="452.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">Volume)</text>
<text x="197.0" y="470.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• e.g. a factory 'golden' image</text>
<rect x="509.0" y="345.1" width="308.0" height="142.3" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="523.0" y="373.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">5. Network</text>
<text x="523.0" y="400.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• loads the software from a server over</text>
<text x="523.0" y="417.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">Ethernet</text>
<text x="523.0" y="435.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• like: office PCs that boot from the</text>
<text x="523.0" y="452.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">network</text>
<text x="523.0" y="470.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151">• e.g. U-Boot tftp, PXE</text>
</svg>

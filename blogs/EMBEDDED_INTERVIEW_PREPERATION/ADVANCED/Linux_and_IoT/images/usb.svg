<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1000" height="660" rx="16" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">USB: the host is in charge, devices answer</text>
<rect x="250" y="70" width="230" height="56" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/>
<text x="365" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Host</text>
<text x="365" y="114" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">PC / SoC with root hub</text>
<rect x="110" y="175" width="190" height="50" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="205" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">USB hub</text>
<rect x="400" y="175" width="200" height="50" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="500" y="197" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Flash drive</text>
<text x="500" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">Mass Storage class</text>
<rect x="30" y="280" width="190" height="50" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="125" y="302" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Keyboard</text>
<text x="125" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">HID class</text>
<rect x="240" y="280" width="200" height="50" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2"/>
<text x="340" y="302" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">USB-serial adapter</text>
<text x="340" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">CDC-ACM → /dev/ttyACM0</text>
<line x1="330" y1="126" x2="205" y2="175" stroke="#0f766e" stroke-width="2.5"/>
<line x1="400" y1="126" x2="500" y2="175" stroke="#0f766e" stroke-width="2.5"/>
<line x1="170" y1="225" x2="125" y2="280" stroke="#0f766e" stroke-width="2.5"/>
<line x1="240" y1="225" x2="340" y2="280" stroke="#0f766e" stroke-width="2.5"/>
<text x="300" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Tiered star: up to 127 devices, each with endpoints (EP0 for control + data endpoints)</text>
<rect x="640" y="70" width="335" height="285" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="807" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">USB 2.0 wires</text>
<rect x="660" y="110" width="60" height="20" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="690" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c0392b">VBUS</text>
<text x="732" y="125" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">5 V power from the host</text>
<rect x="660" y="136" width="60" height="20" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="690" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">D−</text>
<text x="732" y="151" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">data, differential pair</text>
<rect x="660" y="162" width="60" height="20" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="690" y="177" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">D+</text>
<text x="732" y="177" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">data, differential pair</text>
<rect x="660" y="188" width="60" height="20" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="690" y="203" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2937">GND</text>
<text x="732" y="203" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">ground</text>
<text x="807" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Speeds</text>
<text x="807" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">Low speed 1.5 Mbit/s · Full speed 12 Mbit/s</text>
<text x="807" y="288" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">High speed 480 Mbit/s (USB 2.0)</text>
<text x="807" y="308" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">SuperSpeed 5-20 Gbit/s (USB 3.x, extra pairs)</text>
<text x="807" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151">USB4: 40-80 Gbit/s (Type-C only)</text>
<rect x="20" y="380" width="960" height="265" rx="14" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="500" y="406" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">One IN transaction: the host reads an 8-byte key report from the keyboard (address 5, endpoint 1)</text>
<text x="40" y="444" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">1  Token</text>
<text x="40" y="462" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e08a00">host → device</text>
<rect x="190" y="424" width="70" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="225.0" y="454.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">SYNC</text>
<rect x="263" y="424" width="70" height="50" rx="6" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
<text x="298.0" y="446.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">IN</text>
<text x="298.0" y="464.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#374151">PID</text>
<rect x="336" y="424" width="110" height="50" rx="6" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.8"/>
<text x="391.0" y="446.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">5</text>
<text x="391.0" y="464.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#374151">ADDR (7 bit)</text>
<rect x="449" y="424" width="110" height="50" rx="6" fill="#e8f1fd" stroke="#2f6fbe" stroke-width="1.8"/>
<text x="504.0" y="446.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">1</text>
<text x="504.0" y="464.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#374151">ENDP (4 bit)</text>
<rect x="562" y="424" width="80" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="602.0" y="454.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">CRC5</text>
<rect x="645" y="424" width="60" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="675.0" y="454.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">EOP</text>
<text x="40" y="514" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">2  Data</text>
<text x="40" y="532" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2e8b57">device → host</text>
<rect x="190" y="494" width="70" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="225.0" y="524.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">SYNC</text>
<rect x="263" y="494" width="80" height="50" rx="6" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
<text x="303.0" y="516.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">DATA1</text>
<text x="303.0" y="534.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#374151">PID</text>
<rect x="346" y="494" width="300" height="50" rx="6" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.8"/>
<text x="496.0" y="516.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1f2937">00 00 04 00 00 00 00 00</text>
<text x="496.0" y="534.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#374151">8 bytes: key 'a' pressed</text>
<rect x="649" y="494" width="80" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="689.0" y="524.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">CRC16</text>
<rect x="732" y="494" width="60" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="762.0" y="524.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">EOP</text>
<text x="40" y="584" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">3  Handshake</text>
<text x="40" y="602" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e08a00">host → device</text>
<rect x="190" y="564" width="70" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="225.0" y="594.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">SYNC</text>
<rect x="263" y="564" width="70" height="50" rx="6" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/>
<text x="298.0" y="586.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">ACK</text>
<text x="298.0" y="604.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#374151">PID</text>
<rect x="336" y="564" width="60" height="50" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/>
<text x="366.0" y="594.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">EOP</text>
<text x="500" y="630" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151">Other replies: NAK = no data yet, try later · STALL = error. Other transfer types: control, bulk, isochronous.</text>
</svg>
